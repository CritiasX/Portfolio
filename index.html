<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="James Roi Tanglao — Associate Data Engineer at Accenture. Explore my tech stack, development projects, and life beyond the code." />
    <meta name="theme-color" content="#eeece2" />
    <script>
      // Apply the saved palette before the app paints, including on a reload.
      (() => {
        let theme = 'light'
        try { if (localStorage.getItem('jrt-theme') === 'dark') theme = 'dark' } catch {}
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0b141a' : '#eeece2')
      })()
    </script>
    <style>html[data-theme="dark"] { background: #0b141a; color-scheme: dark; }</style>
    <title>James Roi Tanglao — Data Engineer & Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
